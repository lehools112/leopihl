<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Familjens mat</title>
<meta name="theme-color" content="#1f5c45">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f3ec; --surface:#ffffff; --surface-2:#efeadf; --ink:#1d2320; --muted:#68706b;
  --line:#e2dccf; --accent:#1f5c45; --accent-ink:#ffffff; --accent-soft:#dcebe3;
  --warn:#a33a2b; --check:#1f5c45; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --radius:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --surface:#1b201d; --surface-2:#232a26; --ink:#e8ece9; --muted:#9aa49e;
    --line:#2d3530; --accent:#6fc19c; --accent-ink:#0d1a14; --accent-soft:#1f3329;
    --warn:#ef8a7a; --check:#6fc19c; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.hidden{display:none!important}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:1.35rem;margin:0;flex:1;letter-spacing:-.01em}
.sync{font-size:.78rem;color:var(--muted)}
main{max-width:640px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:.78rem;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:24px;height:24px}

.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow)}
.addbar{display:flex;gap:8px;padding:10px;margin-bottom:14px}
.addbar input{flex:1;min-width:0;border:0;background:transparent;padding:8px 6px;outline:none}
.addbar select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:0 6px;max-width:42%}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--surface-2);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;color:var(--warn);border:1px solid currentColor}
.btn:disabled{opacity:.5}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface-2)}

h2.group{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 6px}
ul.items{list-style:none;margin:0;padding:0}
ul.items li{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line)}
ul.items li:last-child{border-bottom:0}
.item-toggle{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;
  padding:12px 4px 12px 14px;min-height:52px}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0}
li.done .box{background:var(--check);border-color:var(--check)}
li.done .box svg{opacity:1;color:var(--accent-ink)}
li.done .item-text{text-decoration:line-through;color:var(--muted)}
.item-text{overflow-wrap:anywhere}
.done-head{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.done-head h2{margin:0 4px}
.empty{text-align:center;color:var(--muted);padding:36px 16px}

.search{display:flex;align-items:center;gap:8px;padding:4px 12px;margin-bottom:10px}
.search input{flex:1;border:0;background:transparent;padding:10px 0;outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.recipe-list{display:grid;gap:10px}
.recipe-card{display:block;width:100%;text-align:left;border:0;padding:14px 16px}
.recipe-card strong{display:block;font-size:1.05rem}
.recipe-card span{font-size:.85rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;background:var(--accent-soft);color:var(--accent);
  border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:1px}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:6;
  border-radius:16px;padding:14px 18px;box-shadow:0 6px 20px rgba(0,0,0,.18)}

.view-head{display:flex;align-items:center;gap:6px;margin:4px 0 8px}
.view-head h2{flex:1;margin:0;font-size:1.4rem;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem;margin:0 0 14px}
section.block{padding:16px;margin-bottom:12px}
section.block h3{margin:0 0 10px;font-size:1rem}
.ing{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ing:last-of-type{border-bottom:0}
.ing input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
ol.steps{margin:0;padding-left:1.3em}
ol.steps li{margin-bottom:10px}
.notes{white-space:pre-wrap;color:var(--muted);margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

form.edit label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 4px}
form.edit input,form.edit select,form.edit textarea{width:100%;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:10px 12px}
form.edit textarea{min-height:140px;resize:vertical}

.login{max-width:360px;margin:12vh auto 0;padding:24px;text-align:center}
.login h1{margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 18px}
.login input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;margin-bottom:10px}
.login .btn{width:100%}
.err{color:var(--warn);min-height:1.4em;margin-top:8px;font-size:.9rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 86px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-size:.92rem;
  max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="login card" id="loginForm">
    <h1>Familjens mat</h1>
    <p>Inköpslista och recept för hela familjen</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Familjens lösenord" required>
    <button class="btn" type="submit">Logga in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <h1 id="title">Inköpslista</h1>
    <span class="sync" id="sync"></span>
  </header>

  <main>
    <!-- Inköpslista -->
    <div id="v-list">
      <form class="addbar card" id="addForm" autocomplete="off">
        <input id="addText" placeholder="Lägg till vara…" maxlength="200" aria-label="Vara">
        <select id="addCat" aria-label="Avdelning"></select>
        <button class="btn" type="submit" aria-label="Lägg till">+</button>
      </form>
      <div id="listGroups"></div>
      <div id="doneWrap" class="hidden">
        <div class="done-head">
          <h2 class="group" id="doneTitle">Klart</h2>
          <button class="btn ghost" id="clearDone" type="button">Rensa avbockade</button>
        </div>
        <ul class="items card" id="doneList"></ul>
      </div>
      <p class="empty hidden" id="listEmpty">Listan är tom. Lägg till något ovan eller från ett recept.</p>
    </div>

    <!-- Receptlista -->
    <div id="v-recipes" class="hidden">
      <div class="search card">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Sök recept eller ingrediens" aria-label="Sök recept">
      </div>
      <div class="chips" id="chips"></div>
      <div class="recipe-list" id="recipeList"></div>
      <p class="empty hidden" id="recipeEmpty">Inga recept hittades.</p>
      <button class="btn fab" id="newRecipe" type="button">+ Nytt recept</button>
    </div>

    <!-- Ett recept -->
    <div id="v-recipe" class="hidden">
      <div class="view-head">
        <button class="icon-btn" type="button" data-back aria-label="Tillbaka">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 id="rTitle"></h2>
      </div>
      <p class="meta" id="rMeta"></p>
      <section class="block card">
        <h3>Ingredienser</h3>
        <div id="rIng"></div>
        <div class="row">
          <button class="btn" type="button" id="toList">Lägg i inköpslistan</button>
          <button class="btn ghost" type="button" id="toggleAll">Avmarkera alla</button>
        </div>
      </section>
      <section class="block card">
        <h3>Gör så här</h3>
        <ol class="steps" id="rSteps"></ol>
      </section>
      <section class="block card" id="rNotesWrap">
        <h3>Tips</h3>
        <p class="notes" id="rNotes"></p>
      </section>
      <div class="row">
        <button class="btn ghost" type="button" id="editRecipe">Redigera</button>
        <button class="btn danger" type="button" id="deleteRecipe">Ta bort</button>
      </div>
    </div>

    <!-- Redigera / nytt recept -->
    <div id="v-edit" class="hidden">
      <div class="view-head">
        <button class="icon-btn" type="button" data-back aria-label="Tillbaka">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <h2 id="eHead">Nytt recept</h2>
      </div>
      <form class="edit" id="editForm">
        <label for="eTitle">Namn</label>
        <input id="eTitle" required maxlength="120">
        <label for="eCat">Kategori</label>
        <select id="eCat"></select>
        <label for="eInfo">Portioner, tid m.m.</label>
        <input id="eInfo" maxlength="120" placeholder="t.ex. 4 port · 45 min">
        <label for="eSource">Länk till originalrecept (valfritt)</label>
        <input id="eSource" type="url" maxlength="500" placeholder="https://…">
        <label for="eIng">Ingredienser – en per rad</label>
        <textarea id="eIng" placeholder="500 g blandfärs&#10;1 gul lök"></textarea>
        <label for="eSteps">Gör så här – ett steg per rad</label>
        <textarea id="eSteps"></textarea>
        <label for="eNotes">Tips (valfritt)</label>
        <textarea id="eNotes" style="min-height:80px"></textarea>
        <div class="row">
          <button class="btn" type="submit">Spara</button>
          <button class="btn ghost" type="button" data-back>Avbryt</button>
        </div>
      </form>
    </div>
  </main>

  <nav class="tabs">
    <button type="button" data-tab="list" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      Inköpslista
    </button>
    <button type="button" data-tab="recipes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/></svg>
      Recept
    </button>
  </nav>
</div>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const CATS = ["Frukt & grönt","Kött & chark","Fisk & skaldjur","Kyl & ägg","Bröd","Skafferi","Fryst","Godis & snacks","Hushåll","Övrigt"];
const RCATS = ["Varmt","Kallt","Sött","Bröd & bak","Övrigt"];
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
const CROSS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

let state = {rev: 0, items: [], recipes: []};
let recipeFilter = "Alla";
let pollTimer = null;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ------------------------------------------------------------ avdelning gissas från namnet
const RULES = [
  ["Fryst", ["fryst", "glass"]],
  ["Hushåll", ["papper", "folie", "diskmedel", "tvättmedel", "påsar", "nötknäckare", "tändstickor", "stearinljus"]],
  ["Skafferi", ["ströbröd", "inlagd", "malen", "pulver", "buljong", "konserv", "kanel"]],
  ["Fisk & skaldjur", ["lax", "räk", "sill", "rom", "ansjovis", "torsk", "fisk", "tonfisk", "kräft", "musslor"]],
  ["Kött & chark", ["färs", "skinka", "revben", "spjäll", "korv", "bacon", "kyckling", "fläsk", "kött", "lamm", "salami", "kalkon", "biff"]],
  ["Kyl & ägg", ["ägg", "mjölk", "havredryck", "dryck", "grädde", "fraiche", "smör", "matfett", " ost", "yoghurt", "kvarg", "jäst", "smetana"]],
  ["Frukt & grönt", ["potatis", "lök", "kål", "dill", "persilja", "äpple", "citron", "lime", "apelsin", "morot", "tomat", "gurka", "sallad", "banan", "pepparrot", "vitlök", "svamp", "champinjon", "avokado", "bär", "rödbet", "päron", "clementin", "mandarin", "selleri", "purjo", "ruccola", "spenat", "timjan", "basilika"]],
  ["Bröd", ["bröd", "knäcke", "bullar", "tunnbröd", "baguette"]],
  ["Godis & snacks", ["godis", "choklad", "chips", "nötter i skal", "julgodis", "kola"]],
  ["Skafferi", ["mjöl", "socker", "sirap", "salt", "peppar", "krydd", "ris", "pasta", "senap", "honung", "vinäger", "olja", "soja", "majonnäs", "russin", "mandel", "nöt", "saffran", "kakao", "gryn", "ingefära", "paprika", "vanilj", "sylt", "kärnor", "frön", "flingor", "nudlar", "bönor", "linser", "tomatpuré", "ketchup"]],
];
function guessCat(text) {
  const t = " " + text.toLowerCase() + " ";
  for (const [cat, words] of RULES) if (words.some(w => t.includes(w))) return cat;
  return "Övrigt";
}

// ------------------------------------------------------------ server
async function api(body) {
  const opts = body ? {method: "POST", headers: {"Content-Type": "application/json", "X-Requested-With": "mat-app"}, body: JSON.stringify(body)} : {};
  const url = body ? "api.php" : "api.php?a=state&since=" + state.rev;
  let res;
  try { res = await fetch(url, {credentials: "same-origin", cache: "no-store", ...opts}); }
  catch { setSync("Ingen anslutning"); throw new Error("offline"); }
  let data = null;
  try { data = await res.json(); } catch { /* ignore */ }
  if (res.status === 401 && !(body && body.a === "login")) { showLogin(); throw new Error("auth"); }
  if (!res.ok) throw new Error((data && data.error) || "Något gick fel (" + res.status + ")");
  return data;
}
function apply(data) {
  if (!data || data.unchanged) return;
  state = {rev: data.rev, items: data.items || [], recipes: data.recipes || []};
  setSync("");
  render();
}
async function act(body) {
  try { apply(await api(body)); }
  catch (e) { if (e.message !== "auth") toast(e.message === "offline" ? "Ingen anslutning – försök igen" : e.message); refresh(); }
}
async function refresh() { try { apply(await api()); } catch { /* visas i sync */ } }
function setSync(t) { $("sync").textContent = t; }
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (!document.hidden) refresh(); }, 8000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("app").classList.contains("hidden")) refresh(); });

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), 2600);
}

// ------------------------------------------------------------ inloggning
function showLogin(msg) {
  clearInterval(pollTimer);
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("loginErr").textContent = msg || "";
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("loginErr").textContent = "";
  try {
    await api({a: "login", password: $("pw").value});
    $("pw").value = "";
    start();
  } catch (err) { $("loginErr").textContent = err.message; }
});
async function boot() {
  let ping;
  try { ping = await (await fetch("api.php?a=ping", {credentials: "same-origin", cache: "no-store"})).json(); }
  catch { showLogin("Hittar inte api.php – kontrollera att alla filer är uppladdade och att PHP är på."); return; }
  if (!ping.configured) { showLogin("Appen är inte färdiginställd: mat-config.php saknas på servern."); return; }
  if (!ping.loggedIn) { showLogin(); return; }
  start();
}
async function start() {
  $("login").classList.add("hidden"); $("app").classList.remove("hidden");
  state.rev = 0;
  await refresh();
  startPolling();
  route();
}

// ------------------------------------------------------------ navigering (#lista, #recept, #recept/id, #ny, #redigera/id)
function go(hash) { if (location.hash !== hash) location.hash = hash; else route(); }
document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => go(b.dataset.tab === "list" ? "#lista" : "#recept")));
document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => history.length > 1 ? history.back() : go("#recept")));
window.addEventListener("hashchange", route);
function route() {
  const [view, id] = location.hash.replace(/^#/, "").split("/");
  const views = {lista: "v-list", recept: id ? "v-recipe" : "v-recipes", ny: "v-edit", redigera: "v-edit"};
  const v = views[view] || "v-list";
  ["v-list","v-recipes","v-recipe","v-edit"].forEach(x => $(x).classList.toggle("hidden", x !== v));
  const listTab = v === "v-list";
  document.querySelectorAll("[data-tab]").forEach(b => {
    if ((b.dataset.tab === "list") === listTab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  $("title").textContent = listTab ? "Inköpslista" : "Recept";
  if (v === "v-recipe") renderRecipe(id);
  if (v === "v-edit") fillEdit(view === "redigera" ? id : null);
  window.scrollTo(0, 0);
}

// ------------------------------------------------------------ rendering
function render() {
  renderList();
  renderRecipes();
  const [view, id] = location.hash.replace(/^#/, "").split("/");
  if (view === "recept" && id) renderRecipe(id, true);
}

function itemRow(it) {
  const li = el("li", it.done ? "done" : "");
  const b = el("button", "item-toggle"); b.type = "button";
  const box = el("span", "box"); box.innerHTML = CHECK;
  b.append(box, el("span", "item-text", it.text));
  b.setAttribute("aria-pressed", it.done ? "true" : "false");
  b.addEventListener("click", () => {
    it.done = !it.done; renderList();             // direkt i appen
    act({a: "toggleItem", id: it.id, done: it.done});
  });
  const del = el("button", "icon-btn"); del.type = "button"; del.innerHTML = CROSS; del.setAttribute("aria-label", "Ta bort " + it.text);
  del.addEventListener("click", () => {
    state.items = state.items.filter(x => x.id !== it.id); renderList();
    act({a: "deleteItem", id: it.id});
  });
  li.append(b, del);
  return li;
}
function renderList() {
  const groups = $("listGroups"); groups.replaceChildren();
  const todo = state.items.filter(i => !i.done), done = state.items.filter(i => i.done);
  for (const c of CATS) {
    const its = todo.filter(i => (CATS.includes(i.cat) ? i.cat : "Övrigt") === c);
    if (!its.length) continue;
    groups.append(el("h2", "group", c));
    const ul = el("ul", "items card"); its.forEach(i => ul.append(itemRow(i))); groups.append(ul);
  }
  $("doneWrap").classList.toggle("hidden", !done.length);
  $("doneTitle").textContent = "Klart (" + done.length + ")";
  const dl = $("doneList"); dl.replaceChildren(); done.forEach(i => dl.append(itemRow(i)));
  $("listEmpty").classList.toggle("hidden", state.items.length > 0);
}

function renderRecipes() {
  const chips = $("chips"); chips.replaceChildren();
  for (const c of ["Alla", ...RCATS]) {
    if (c !== "Alla" && !state.recipes.some(r => r.cat === c)) continue;
    const b = el("button", "chip", c); b.type = "button"; b.setAttribute("aria-pressed", c === recipeFilter ? "true" : "false");
    b.addEventListener("click", () => { recipeFilter = c; renderRecipes(); });
    chips.append(b);
  }
  const q = $("q").value.trim().toLowerCase();
  const list = state.recipes
    .filter(r => recipeFilter === "Alla" || r.cat === recipeFilter)
    .filter(r => !q || (r.title + " " + (r.ingredients || []).join(" ")).toLowerCase().includes(q))
    .sort((a, b) => a.title.localeCompare(b.title, "sv"));
  const box = $("recipeList"); box.replaceChildren();
  for (const r of list) {
    const b = el("button", "recipe-card card"); b.type = "button";
    const s = el("strong", null, r.title);
    const m = el("span"); const t = el("span", "tag", r.cat); m.append(t, document.createTextNode(r.info || ""));
    b.append(s, m);
    b.addEventListener("click", () => go("#recept/" + r.id));
    box.append(b);
  }
  $("recipeEmpty").classList.toggle("hidden", list.length > 0);
}
$("q").addEventListener("input", renderRecipes);
$("newRecipe").addEventListener("click", () => go("#ny"));

let currentRecipe = null;
function renderRecipe(id, keepChecks) {
  const r = state.recipes.find(x => x.id === id);
  if (!r) { if (state.rev) go("#recept"); return; }
  const prev = keepChecks && currentRecipe && currentRecipe.id === id
    ? [...$("rIng").querySelectorAll("input")].map(c => c.checked) : null;
  currentRecipe = r;
  $("rTitle").textContent = r.title;
  const meta = $("rMeta"); meta.replaceChildren(el("span", "tag", r.cat), document.createTextNode(r.info || ""));
  if (r.source) {
    meta.append(document.createTextNode(" · "));
    const a = el("a", null, "Originalrecept"); a.href = r.source; a.target = "_blank"; a.rel = "noopener"; meta.append(a);
  }
  const ing = $("rIng"); ing.replaceChildren();
  (r.ingredients || []).forEach((line, i) => {
    const lab = el("label", "ing"); const cb = el("input"); cb.type = "checkbox";
    cb.checked = prev && i < prev.length ? prev[i] : true;
    cb.addEventListener("change", updateToList);
    lab.append(cb, el("span", null, line)); ing.append(lab);
  });
  const ol = $("rSteps"); ol.replaceChildren(); (r.steps || []).forEach(s => ol.append(el("li", null, s)));
  $("rNotes").textContent = r.notes || "";
  $("rNotesWrap").classList.toggle("hidden", !r.notes);
  updateToList();
}
function updateToList() {
  const boxes = [...$("rIng").querySelectorAll("input")];
  const n = boxes.filter(b => b.checked).length;
  $("toList").textContent = n ? "Lägg " + n + " i inköpslistan" : "Lägg i inköpslistan";
  $("toList").disabled = !n;
  $("toggleAll").textContent = n === boxes.length ? "Avmarkera alla" : "Markera alla";
}
$("toggleAll").addEventListener("click", () => {
  const boxes = [...$("rIng").querySelectorAll("input")];
  const all = boxes.every(b => b.checked); boxes.forEach(b => b.checked = !all); updateToList();
});
$("toList").addEventListener("click", async () => {
  const r = currentRecipe; if (!r) return;
  const lines = [...$("rIng").querySelectorAll("label")].filter(l => l.querySelector("input").checked).map(l => l.textContent.trim());
  const open = new Set(state.items.filter(i => !i.done).map(i => i.text.toLowerCase()));
  const items = lines.map(t => ({text: t + " (" + r.title + ")", cat: guessCat(t)}))
                     .filter(i => !open.has(i.text.toLowerCase()));
  if (!items.length) { toast("Allt finns redan i listan"); return; }
  await act({a: "addItems", items});
  toast(items.length + (items.length === 1 ? " vara" : " varor") + " tillagda i inköpslistan");
});
$("editRecipe").addEventListener("click", () => currentRecipe && go("#redigera/" + currentRecipe.id));
$("deleteRecipe").addEventListener("click", async () => {
  const r = currentRecipe; if (!r || !confirm("Ta bort receptet \"" + r.title + "\"?")) return;
  await act({a: "deleteRecipe", id: r.id});
  go("#recept");
});

let editingId = null;
function fillEdit(id) {
  const r = id ? state.recipes.find(x => x.id === id) : null;
  editingId = r ? r.id : null;
  $("eHead").textContent = r ? "Redigera recept" : "Nytt recept";
  $("eTitle").value = r ? r.title : "";
  $("eCat").value = r ? r.cat : "Varmt";
  $("eInfo").value = r ? r.info || "" : "";
  $("eSource").value = r ? r.source || "" : "";
  $("eIng").value = r ? (r.ingredients || []).join("\n") : "";
  $("eSteps").value = r ? (r.steps || []).join("\n") : "";
  $("eNotes").value = r ? r.notes || "" : "";
}
$("editForm").addEventListener("submit", async e => {
  e.preventDefault();
  const recipe = {id: editingId || "", title: $("eTitle").value, cat: $("eCat").value, info: $("eInfo").value,
    source: $("eSource").value, ingredients: $("eIng").value, steps: $("eSteps").value, notes: $("eNotes").value};
  const before = new Set(state.recipes.map(r => r.id));
  try {
    apply(await api({a: "saveRecipe", recipe}));
    const id = editingId || (state.recipes.find(r => !before.has(r.id)) || {}).id;
    toast("Receptet är sparat");
    history.replaceState(null, "", id ? "#recept/" + id : "#recept"); route();
  } catch (err) { if (err.message !== "auth") toast(err.message); }
});

// ------------------------------------------------------------ lägg till vara
$("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("addText").value.trim(); if (!text) return;
  const sel = $("addCat").value;
  act({a: "addItems", items: [{text, cat: sel === "auto" ? guessCat(text) : sel}]});
  $("addText").value = ""; $("addText").focus();
});
$("clearDone").addEventListener("click", () => {
  state.items = state.items.filter(i => !i.done); renderList(); act({a: "clearDone"});
});

// ------------------------------------------------------------ start
(function init() {
  const sel = $("addCat"); const o = el("option", null, "Auto"); o.value = "auto"; sel.append(o);
  CATS.forEach(c => { const x = el("option", null, c); x.value = c; sel.append(x); });
  RCATS.forEach(c => { const x = el("option", null, c); x.value = c; $("eCat").append(x); });
  boot();
})();
</script>
</body>
</html>
