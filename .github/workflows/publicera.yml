name: Publicera till Inleed

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicera:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Python-verktyg
        run: pip install jinja2

      - name: Bygg sidan av texterna och mallarna
        run: python3 bygg.py

      - name: Ladda upp till Inleed via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          security: loose
          local-dir: ./public/
          server-dir: ./
