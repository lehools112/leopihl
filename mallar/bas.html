<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block titel %}{% endblock %}</title>
<meta name="description" content="{% block beskrivning %}{% endblock %}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%2312102a'/%3E%3Crect x='1' y='3' width='6' height='3' fill='%2337f2c4'/%3E%3Crect x='2' y='4' width='1' height='1' fill='%2312102a'/%3E%3Crect x='5' y='4' width='1' height='1' fill='%23ff5ea8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;700&display=swap">
<!-- ?v= sätts automatiskt vid varje publicering, så webbläsaren alltid hämtar nya filer -->
<link rel="stylesheet" href="style.css?v={{ version }}">
</head>
<body>

{#- ===== MENY =====
    Vill du lägga till en sida? Lägg till den i listan "menyn" i bygg.py och gör en ny mall. #}
<nav class="nav" aria-label="Meny">
  <div class="wrap">
    <a class="logo" href="index.html">LEO PIHL</a>
    <ul>
{%- for sida in meny %}
      <li><a href="{{ sida.fil }}"{% if sida.fil == aktiv %} aria-current="page"{% endif %}>{{ sida.namn }}</a></li>
{%- endfor %}
    </ul>
  </div>
</nav>

{% block innehall %}{% endblock %}

<footer class="wrap">
  <p>{{ sidfot }}</p>
</footer>

{% block skript %}{% endblock %}
</body>
</html>
